[pytest]
testpaths = test
pythonpath = .
asyncio_mode = auto
# Colección: suites ATDD con nombre exigido por la consigna (*_contracts.test.py).
python_files = test_*.py *_contracts.test.py
# importlib: los nombres con punto (module1_contracts.test.py) no rompen la colección.
addopts = --import-mode=importlib
markers =
    p0: prioridad P0 (critica, sin workaround seguro)
    p1: prioridad P1 (core/frecuente, workaround limitado)
    p2: prioridad P2 (secundaria, workaround aceptable)
    p3: prioridad P3 (rara/minima, workaround facil)
    atdd: acceptance test-driven development (RED por NotImplementedError)
    edge_case: Mandatory Edge Case / EDGE-01 (CS101 vs CS-480)
    explainability: ExplanationDTO con regla citada (AD-11)
    guard: invariante impuesto por el DDL (verde en RED, no es atdd-red)
